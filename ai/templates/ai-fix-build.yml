# TEMPLATE — INACTIVE.
#
# This file lives in ai/templates/, not .github/workflows/, so GitHub does not
# see it and will never run it automatically. No repository receives it automatically.
# To use it, deliberately copy it to .github/workflows/ in ONE pilot repository,
# then assess whether it is worth expanding.
#
# What it does: takes a failed build log, asks the model for a diagnosis and a
# proposed fix, and returns the result as an ARTIFACT. It commits and merges nothing.
#
# Three assumptions that must not be loosened:
#   1. `permissions: contents: read` and nothing more. No `pull-requests: write`,
#      no `contents: write`. The agent has no path to write or merge.
#   2. `persist-credentials: false` in checkout. Researchers used this path
#      (.git/config) to extract a token from Google's Gemini CLI workflow and
#      push to main.
#   3. The result is a proposal, not a verdict. Deterministic CI and Renovate's
#      status assessment remain the gates. The model sets no check.

name: ai — failed build diagnosis (template, manually triggered)

# Manual only. There is deliberately NO `workflow_run`, `pull_request`, or
# `schedule`: each would run the agent on content nobody reviewed, which is a
# direct prompt-injection surface from a changelog.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the workflow run whose log is to be analyzed"
        required: true
        type: string
      provider:
        description: "Provider from ai/providers.json (empty = default chain)"
        required: false
        default: ""
        type: string
      escalate:
        description: "Start with the escalation model (harder case)"
        required: false
        default: false
        type: boolean

# Nothing by default. Only the job grants permissions, and only read permissions.
permissions: {}

concurrency:
  group: ai-diagnoza-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read   # to check out the repository
      actions: read    # to read the selected run's log

    steps:
      - name: Check out without leaving a token in .git/config
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch the provider layer from the controlling repository
        uses: actions/checkout@v7
        with:
          repository: dudziakm/dep-automation
          path: .dep-automation
          persist-credentials: false

      - name: Collect the failed run log
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          # The log can be huge, but the agent only needs the tail. Limit input
          # so we do not pay for 200 thousand tokens of runner configuration.
          gh run view "$RUN_ID" --log-failed > /tmp/build.log 2>/dev/null \
            || gh run view "$RUN_ID" --log > /tmp/build.log
          tail -c 40000 /tmp/build.log > /tmp/build.tail.log
          wc -c /tmp/build.tail.log

      - name: Assemble the prompt
        run: |
          set -euo pipefail
          {
            echo "The build in repository ${GITHUB_REPOSITORY} failed after a dependency upgrade."
            echo "Below is the log tail. Provide: (1) the most likely cause,"
            echo "(2) the minimal manifest or configuration change that fixes it,"
            echo "(3) how that change can be verified locally."
            echo "Do not assess whether the change may be merged; CI decides that."
            echo
            echo "--- LOG ---"
            cat /tmp/build.tail.log
          } > /tmp/prompt.txt

      - name: Query the model
        env:
          # Secrets enter only this step and only as environment variables.
          # The script reads them through printenv and passes them on neither in
          # arguments nor in logs.
          # The chain is deepseek -> deepseek-pro -> openrouter -> kimi, which
          # means exactly these three secrets. A missing secret does not break
          # the run: the script skips that provider and moves to the next.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          PROVIDER: ${{ inputs.provider }}
          ESCALATE: ${{ inputs.escalate }}
        run: |
          set -euo pipefail
          args=""
          if [ -n "$PROVIDER" ]; then
            args="-p $PROVIDER"
          elif [ "$ESCALATE" = "true" ]; then
            args="--escalate"
          fi
          # shellcheck disable=SC2086  # args is built only from values above
          bash .dep-automation/ai/scripts/ai-call.sh $args /tmp/prompt.txt > /tmp/diagnoza.md

      - name: Return the diagnosis as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnoza-ai-${{ inputs.run_id }}
          path: /tmp/diagnoza.md
          if-no-files-found: warn
          retention-days: 7

      - name: Summary in the run interface
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## AI diagnosis — PROPOSAL, not a verdict"
            echo
            echo "This content is not a gate. Whether anything reaches \`main\` is decided"
            echo "by deterministic CI checks and Renovate's status assessment."
            echo
            if [ -s /tmp/diagnoza.md ]; then
              cat /tmp/diagnoza.md
            else
              echo "_The model returned no response. See the log for the \"Query the model\" step._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

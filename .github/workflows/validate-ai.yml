name: validate ai layer

# Deliberately separate from validate.yml: that workflow validates Renovate
# presets, while this one validates the provider layer. They are separate so an
# error in one cannot hide an error in the other.

on:
  push:
    branches: [main]
    paths:
      - "ai/**"
      - ".github/workflows/validate-ai.yml"
  pull_request:
    paths:
      - "ai/**"
      - ".github/workflows/validate-ai.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # v7, not v4: v4 works, but the runner reports a deprecation warning for
      # Node.js 20. The template in ai/templates/ also uses v7 — one version
      # across the entire layer.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: providers.json is valid JSON and has required fields
        run: |
          set -euo pipefail
          jq -e . ai/providers.json > /dev/null

          # Every provider must have four fields without which the script cannot work.
          braki=$(jq -r '
            .providers
            | to_entries[]
            | select((.value.base_url // "") == ""
                  or (.value.model // "") == ""
                  or (.value.secret // "") == ""
                  or (.value.status // "") == "")
            | .key' ai/providers.json)
          if [ -n "$braki" ]; then
            echo "::error file=ai/providers.json::incomplete provider entries: $braki"
            exit 1
          fi

          # The script stores the chain as a space-separated list, so a provider
          # name containing whitespace would silently break it.
          zle_nazwy=$(jq -r '.providers | keys[] | select(test("\\s"))' ai/providers.json)
          if [ -n "$zle_nazwy" ]; then
            echo "::error file=ai/providers.json::provider names must not contain whitespace: $zle_nazwy"
            exit 1
          fi

          # The chain must not reference a non-existent or disabled provider;
          # otherwise the default call would target a provider without a key and
          # fail only at runtime. A role is a name or a list of names, so flatten each.
          for rola in domyslny eskalacja zapas; do
            refs=$(jq -r --arg r "$rola" \
              '[.lancuch[$r]] | flatten | map(select(type == "string" and . != "")) | .[]' ai/providers.json)
            [ -n "$refs" ] || continue
            for ref in $refs; do
              if ! jq -e --arg r "$ref" '.providers | has($r)' ai/providers.json > /dev/null; then
                echo "::error file=ai/providers.json::lancuch.${rola} references nonexistent provider '$ref'"
                exit 1
              fi
              pstatus=$(jq -r --arg r "$ref" '.providers[$r].status' ai/providers.json)
              if [ "$pstatus" != "aktywny" ]; then
                echo "::error file=ai/providers.json::lancuch.${rola} references '$ref', which has status '$pstatus' instead of 'aktywny'"
                exit 1
              fi
            done
          done

          # A sidelined provider may be disabled, but must not pretend to be
          # active — status 'aktywny' outside the chain means someone forgot
          # to add it to the chain or disable it. Today every entry is active and
          # in the chain, so this rule protects future additions rather than the
          # current state.
          osierocone=$(jq -r '
            ([.lancuch.domyslny, .lancuch.eskalacja, .lancuch.zapas]
             | flatten
             | map(select(type == "string"))) as $chain
            | .providers
            | to_entries[]
            | select(.value.status == "aktywny")
            | .key
            | . as $nazwa
            | select(($chain | index($nazwa)) == null)' ai/providers.json)
          if [ -n "$osierocone" ]; then
            echo "::error file=ai/providers.json::providers with status 'aktywny' outside the chain: $osierocone"
            exit 1
          fi

          # Parameter overrides enter the request through jq --argjson, so a
          # non-numeric value would fail only at runtime.
          zle_parametry=$(jq -r '
            .providers
            | to_entries[]
            | select(.value.parametry != null)
            | .key as $k
            | .value.parametry
            | to_entries[]
            | select((.key | test("^(max_tokens|temperature)$")) and (.value | type) != "number")
            | "\($k).\(.key)"' ai/providers.json)
          if [ -n "$zle_parametry" ]; then
            echo "::error file=ai/providers.json::parameter overrides must be numbers: $zle_parametry"
            exit 1
          fi

      - name: configuration has secret names only, never values
        run: |
          set -euo pipefail
          # Hygiene check: no string that looks like an API key may enter the
          # repository. The patterns cover Google, DeepSeek, and OpenRouter formats.
          if grep -rEn 'AIza[0-9A-Za-z_-]{30,}|sk-[0-9a-zA-Z]{20,}|sk-or-v1-[0-9a-f]{16,}' ai/; then
            echo "::error::found a string resembling an API key in the ai/ directory"
            exit 1
          fi
          echo "no traces of secrets — OK"

      - name: shellcheck and bash -n
        run: |
          set -euo pipefail
          shellcheck ai/scripts/*.sh
          for f in ai/scripts/*.sh; do bash -n "$f"; done

      - name: workflow templates are valid YAML
        run: |
          set -euo pipefail
          for f in ai/templates/*.yml; do
            python3 -c "import sys,yaml; yaml.safe_load(open(sys.argv[1]))" "$f"
            echo "$f OK"
          done

      - name: script works without secrets in informational modes
        run: |
          set -euo pipefail
          bash ai/scripts/ai-call.sh --list
          bash ai/scripts/ai-call.sh --check

      - name: without secrets, a real call exits with code 3 rather than succeeding
        run: |
          set -euo pipefail
          # Control test for fail-closed behavior: missing keys must not result
          # in exit 0, as the caller would treat no response as an empty response.
          rc=0
          echo "test" | bash ai/scripts/ai-call.sh > /dev/null 2>&1 || rc=$?
          if [ "$rc" -ne 3 ]; then
            echo "::error::expected code 3 when secrets are missing, got $rc"
            exit 1
          fi
          echo "fail-closed confirmed — code 3"

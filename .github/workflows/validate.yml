name: validate presets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Walidator klasyfikuje plik po nazwie, a nazwy presetow (js.json itd.)
      # nie sa mu znane. Kopiujemy kazdy pod renovate.json i walidujemy osobno.
      - name: renovate-config-validator
        run: |
          set -euo pipefail
          fail=0
          for f in default.json js.json jvm.json mixed.json silent.json; do
            echo "::group::$f"
            rm -rf /tmp/v && mkdir -p /tmp/v && cp "$f" /tmp/v/renovate.json
            if (cd /tmp/v && npx --yes --package renovate@latest \
                 renovate-config-validator --strict renovate.json); then
              echo "$f OK"
            else
              echo "::error file=$f::walidacja nieudana"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      # renovate-config-validator NIE pobiera zdalnych presetow: config z
      # celowo blednym "github>owner/repo:nie-ma-takiego" przechodzi u niego
      # jako poprawny. Zmiana nazwy pliku presetu przeszlaby wiec niezauwazona,
      # a wysypalaby sie dopiero u bota. Dlatego sprawdzamy odniesienia sami.
      - name: odniesienia miedzy presetami
        run: |
          set -euo pipefail
          fail=0
          for f in default.json js.json jvm.json mixed.json silent.json; do
            while read -r ref; do
              [[ -z "$ref" ]] && continue
              if [[ "$ref" == "github>dudziakm/dep-automation" ]]; then
                target=default.json
              else
                target="${ref##*:}.json"
              fi
              if [[ -f "$target" ]]; then
                echo "$f -> $ref (plik $target istnieje)"
              else
                echo "::error file=$f::preset '$ref' wskazuje na brakujacy plik $target"
                fail=1
              fi
            done < <(jq -r '(.extends // [])[] | select(startswith("github>dudziakm/dep-automation"))' "$f")
          done
          exit $fail

      - name: shellcheck skryptow
        run: shellcheck scripts/*.sh

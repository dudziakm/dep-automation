name: validate presets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # v5+ runs on Node 24; v4 still targets Node 20 and warns on the runner.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # The validator classifies by filename, and preset names (js.json etc.)
      # are unknown to it. Copy each file to renovate.json and validate separately.
      - name: renovate-config-validator
        run: |
          set -euo pipefail
          fail=0
          for f in default.json js.json jvm.json mixed.json silent.json; do
            echo "::group::$f"
            rm -rf /tmp/v && mkdir -p /tmp/v && cp "$f" /tmp/v/renovate.json
            if (cd /tmp/v && npx --yes --package renovate@latest \
                 renovate-config-validator --strict renovate.json); then
              echo "$f OK"
            else
              echo "::error file=$f::validation failed"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      # renovate-config-validator does NOT fetch remote presets: a config with a
      # deliberately broken "github>owner/repo:does-not-exist" still passes.
      # Renaming a preset file would therefore slip through here and only fail
      # at the bot. Check local references ourselves.
      - name: cross-preset references
        run: |
          set -euo pipefail
          fail=0
          for f in default.json js.json jvm.json mixed.json silent.json; do
            while read -r ref; do
              [[ -z "$ref" ]] && continue
              if [[ "$ref" == "github>dudziakm/dep-automation" ]]; then
                target=default.json
              else
                target="${ref##*:}.json"
              fi
              if [[ -f "$target" ]]; then
                echo "$f -> $ref (file $target exists)"
              else
                echo "::error file=$f::preset '$ref' points at missing file $target"
                fail=1
              fi
            done < <(jq -r '(.extends // [])[] | select(startswith("github>dudziakm/dep-automation"))' "$f")
          done
          exit $fail

      - name: shellcheck scripts
        run: shellcheck scripts/*.sh
